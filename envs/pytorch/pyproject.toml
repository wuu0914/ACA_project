[project]
name = "ca-project-pytorch-env"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy",
    "pillow",
    "timm",
    "torch",
    "torchvision",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
